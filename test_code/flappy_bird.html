<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird - 类 Flappy 小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b1f36;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  #game {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    background: #70c5ce;
    cursor: pointer;
  }
  #hint {
    position: fixed;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,.75);
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: none;
  }
  /* ---------- 自定义小鸟贴图工具栏 ---------- */
  #toolbar {
    position: fixed;
    top: 10px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    z-index: 20;
    padding: 6px 10px;
  }
  #toolbar button,
  #toolbar label {
    background: rgba(30, 60, 90, 0.85);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  #toolbar button:hover,
  #toolbar label:hover { background: rgba(50, 90, 130, 0.9); }
  #toolbar label { display: inline-block; }
  #toolbar label:hover span { text-decoration: underline; }
  #skinStatus {
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    max-width: 200px;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
<div id="toolbar">
  <label for="skinFile" title="支持 JPG / PNG 格式">📷 导入小鸟贴图
    <input type="file" id="skinFile" accept=".jpg,.jpeg,.png,image/jpeg,image/png" style="display:none;">
  </label>
  <button id="resetSkin" type="button">↩️ 恢复默认</button>
  <span id="skinStatus"></span>
</div>
<div id="stage">
  <canvas id="game" width="400" height="600"></canvas>
</div>
<div id="hint">🖱️ 鼠标 / 空格 / 触摸 控制跳跃</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ---------- 尺寸自适应（保持 2:3 比例，最大适配视口） ----------
  const BASE_W = 400, BASE_H = 600, RATIO = BASE_W / BASE_H;
  function resize() {
    const maxH = window.innerHeight - 30;
    const maxW = window.innerWidth;
    let w = Math.min(maxW, maxH * RATIO);
    let h = w / RATIO;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 常量 ----------
  const GROUND_H = 90;
  const BIRD_X = 90;
  const BIRD_R = 14;

  // ---------- 游戏状态 ----------
  let state;            // "ready" | "play" | "over"
  let bird;
  let pipes;
  let groundOffset;
  let score;
  let best;
  let frame;
  let speed;            // 当前水平速度（随难度提升）
  let gravity;
  let flapping;         // 翅膀动画帧
  let deltaTime;

  // 音效（Web Audio 合成）
  let audioCtx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.value = vol || 0.1;
      o.connect(g);
      g.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      g.gain.setValueAtTime(vol || 0.1, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.start(now);
      o.stop(now + dur);
    } catch (e) { /* 音效失败时静默忽略 */ }
  }
  const sfx = {
    wing:  () => beep(680, 0.09, "triangle", 0.12),
    point: () => beep(880, 0.08, "sine", 0.12),
    hit:   () => beep(160, 0.28, "sawtooth", 0.18),
    die:   () => beep(90, 0.5, "sine", 0.16)
  };

  // ---------- 自定义小鸟贴图 ----------
  const SKIN_KEY = "flappy_bird_skin";
  let customSkin = null;          // Image 对象（用户导入）
  let skinName = "";              // 文件名提示
  const skinStatusEl = document.getElementById("skinStatus");

  function showStatus(msg, isErr) {
    if (!skinStatusEl) return;
    skinStatusEl.textContent = msg;
    skinStatusEl.style.color = isErr ? "#ffb3b3" : "rgba(255,255,255,0.9)";
  }

  // 加载用户保存的贴图
  function loadSkin() {
    try {
      const data = localStorage.getItem(SKIN_KEY);
      if (!data) return false;
      const img = new Image();
      img.onload = function () {
        customSkin = img;
        showStatus("已加载自定义贴图");
      };
      img.onerror = function () {
        try { localStorage.removeItem(SKIN_KEY); } catch (e) {}
        showStatus("贴图加载失败，已重置", true);
      };
      img.src = data;
      return true;
    } catch (e) { return false; }
  }

  // 保存并应用新贴图
  function applySkin(file) {
    const name = (file && file.name) || "";
    if (!file) { showStatus("未选择文件", true); return; }
    // 校验文件类型
    if (!/image\/(jpeg|png)|\.(jpe?g|png)$/i.test(file.type + file.name)) {
      showStatus("仅支持 JPG / PNG 格式", true);
      return;
    }
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        customSkin = img;
        skinName = name;
        // 压缩存储到 localStorage 以免爆容量
        const maxSide = 256;
        const sc = Math.max(img.width, img.height) > maxSide
                 ? maxSide / Math.max(img.width, img.height) : 1;
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc);
        c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try {
          localStorage.setItem(SKIN_KEY, c.toDataURL("image/png"));
        } catch (e) { /* 存储失败不影响本次使用 */ }
        showStatus("✓ 已应用：" + (name || "自定义贴图"));
        sfx.point();
      };
      img.onerror = function () {
        showStatus("图片解析失败，请重试", true);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 恢复默认外观
  function resetSkin() {
    customSkin = null;
    skinName = "";
    try { localStorage.removeItem(SKIN_KEY); } catch (e) {}
    showStatus("已恢复默认小鸟");
  }

  // 绑定贴图相关 UI
  (function bindSkinUI() {
    const fileInput = document.getElementById("skinFile");
    const resetBtn = document.getElementById("resetSkin");
    if (fileInput) {
      fileInput.addEventListener("change", function (e) {
        const f = e.target.files && e.target.files[0];
        if (f) applySkin(f);
        fileInput.value = "";   // 允许重复选择同一文件
      });
    }
    if (resetBtn) {
      resetBtn.addEventListener("click", function () {
        resetSkin();
        draw();  // 立即刷新画面
      });
    }
  })();

  // 支持拖拽导入 （把文件拖到整个页面）
  let dragCounter = 0;
  document.addEventListener("dragenter", function (e) { e.preventDefault(); dragCounter++; });
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("dragleave", function (e) { e.preventDefault(); dragCounter--; });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    dragCounter = 0;
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && /image\/(jpeg|png)|\.(jpe?g|png)$/i.test(f.type + f.name)) {
      applySkin(f);
    } else {
      showStatus("请拖入 JPG / PNG 图片", true);
    }
  });

  // ---------- 初始化 ----------
  function reset() {
    bird = { y: BASE_H / 2, vy: 0, rot: 0 };
    pipes = [];
    groundOffset = 0;
    score = 0;
    frame = 0;
    speed = 2.0;
    gravity = 0.16;
    flapping = 0;
    // 首次生成两个管道，留出初始空隙
    for (let i = 0; i < 3; i++) {
      pushPipe(BASE_W + 190 + i * gapSpace());
    }
  }

  function gapSpace() {
    // 管道间距随难度略微收紧（配合慢速，间距放宽便于操控）
    const base = 250;
    const min = 195;
    return Math.max(min, base - score * 2);
  }
  function gapHeight() {
    // 间隙高度随难度收紧
    const base = 155;
    const min = 118;
    return Math.max(min, base - score * 2);
  }

  function pushPipe(x) {
    const gap = gapHeight();
    const margin = 70;               // 上下各留一点余量
    const usable = BASE_H - GROUND_H;
    const minTop = margin;
    const maxTop = usable - gap - margin;
    const topH = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x: x, topH: topH, gap: gap, scored: false });
  }

  // 距上一根管道超过 gapSpace 就补新管
  function ensurePipes() {
    const last = pipes[pipes.length - 1];
    if (last && last.x < BASE_W - 20) {
      pushPipe(last.x + gapSpace());
      // 保持最多 3 根在屏幕上
      const extra = pipes.length - 3;
      for (let i = 0; i < extra; i++) pipes.shift();
    }
  }

  // ---------- 输入 ----------
  function flap() {
    if (state === "ready") {
      state = "play";
      bird.vy = -5.6;
      bird.moved = true;
      sfx.wing();
      flapAnim();
      return;
    }
    if (state === "play") {
      bird.vy = -5.6;
      sfx.wing();
      flapAnim();
    }
  }
  function flapAnim() { flapping = 6; }

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      flap();
    }
  });
  canvas.addEventListener("mousedown", flap);
  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); flap(); });

  function restart() {
    reset();
    state = "ready";
    draw();
  }

  // ---------- 更新 ----------
  function update() {
    frame++;
    groundOffset = (groundOffset + speed) % 40;

    if (flapping > 0) flapping--;

    if (state === "play" || state === "over") {
      bird.vy += gravity;
      bird.y += bird.vy;
      // 旋转角度：随速度变化，飞行时上扬，下落时俯冲
      const target = Math.max(-0.5, Math.min(Math.PI / 2, bird.vy * 0.09 + 0.1));
      bird.rot += (target - bird.rot) * 0.15;
    } else {
      // ready 状态下轻微浮动
      bird.rot = 0;
      bird.y = BASE_H / 2 + Math.sin(frame * 0.08) * 6;
    }

    if (state === "play") {
      // 移动管道
      for (let i = 0; i < pipes.length; i++) {
        pipes[i].x -= speed;
        const p = pipes[i];
        // 计分：小鸟越过管道而不碰撞
        if (!p.scored && p.x + 34 < BIRD_X - BIRD_R) {
          p.scored = true;
          score++;
          // 难度升级
          speed = Math.min(4.2, speed + 0.14);
          gravity = Math.min(0.26, gravity + 0.005);
          sfx.point();
        }
      }
      ensurePipes();

      // 碰撞检测（去掉已完全移出屏幕的）
      pipes = pipes.filter(p => p.x > -60);

      // 天花板
      if (bird.y < -BIRD_R) bird.y = -BIRD_R;

      // 地面碰撞
      if (bird.y + BIRD_R > BASE_H - GROUND_H) {
        bird.y = BASE_H - GROUND_H - BIRD_R;
        gameOver(true);
        return;
      }

      // 管道碰撞
      const rr = BIRD_R - 3; // 略宽松的判定盒
      for (const p of pipes) {
        const px = p.x, pw = 34;
        if (px < BIRD_X + rr && px + pw > BIRD_X - rr) {
          const top = p.topH, bot = p.topH + p.gap;
          if (bird.y - rr < top || bird.y + rr > bot) {
            gameOver(false);
            return;
          }
        }
      }
    }
  }

  // ---------- 游戏结束 ----------
  function gameOver(hitGround) {
    state = "over";
    bird.vy = hitGround ? 0 : 4;   // 撞地时反弹一下显自然
    sfx.hit();
    setTimeout(function () {
      if (state === "over") sfx.die();
    }, 120);
    if (score > best) {
      best = score;
      try { localStorage.setItem("flappy_best", String(best)); } catch (e) {}
    }
  }

  function loadBest() {
    try { return parseInt(localStorage.getItem("flappy_best")) || 0; } catch (e) { return 0; }
  }

  // ---------- 绘制 ----------
  function draw() {
    // 天空渐变
    const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
    grad.addColorStop(0, "#7cd2e8");
    grad.addColorStop(0.7, "#c2e9d9");
    grad.addColorStop(1, "#eaf7bd");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, BASE_W, BASE_H);

    // 云朵（静态装饰）
    drawClouds();

    // 管道
    for (const p of pipes) drawPipe(p);

    // 地面
    drawGround();

    // 小鸟
    if (state !== "ready") drawBird();

    // UI
    drawUI();
  }

  function drawClouds() {
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    const cld = [
      { x: 50, y: 90, s: 1.1 },
      { x: 180, y: 60, s: 0.8 },
      { x: 320, y: 130, s: 1.3 }
    ];
    for (const c of cld) {
      const off = (frame * 0.15) % (BASE_W + 160) - 80;
      drawCloud((c.x + off) % BASE_W, c.y, c.s);
    }
  }
  function drawCloud(x, y, s) {
    if (x < -40) x += BASE_W;
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y - 10 * s, 15 * s, 0, Math.PI * 2);
    ctx.arc(x + 38 * s, y, 17 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPipe(p) {
    const W = 34;
    ctx.fillStyle = "#4caf3f";
    // 上管
    ctx.fillRect(p.x, 0, W, p.topH);
    // 下管
    const botY = p.topH + p.gap;
    ctx.fillRect(p.x, botY, W, BASE_H - GROUND_H - botY);
    // 帽檐
    ctx.fillStyle = "#66bb6a";
    ctx.fillRect(p.x - 3, p.topH - 20, W + 6, 20);
    ctx.fillRect(p.x - 3, botY, W + 6, 20);
    // 高光
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.fillRect(p.x + 5, 0, 6, p.topH - 20);
    ctx.fillRect(p.x + 5, botY + 20, 6, BASE_H - GROUND_H - botY - 20);
  }

  function drawGround() {
    // 泥土
    ctx.fillStyle = "#d8c15a";
    ctx.fillRect(0, BASE_H - GROUND_H, BASE_W, GROUND_H);
    ctx.fillStyle = "#9c7b2f";
    ctx.fillRect(0, BASE_H - 20, BASE_W, 20);

    // 草地纹
    ctx.fillStyle = "#7cb342";
    const step = 40;
    for (let i = -1; i < BASE_W / step + 1; i++) {
      const x = i * step - groundOffset;
      ctx.beginPath();
      ctx.moveTo(x, BASE_H - GROUND_H);
      ctx.lineTo(x + step / 2, BASE_H - GROUND_H - 9);
      ctx.lineTo(x + step, BASE_H - GROUND_H);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBird() {
    const wob = flapping > 0 ? (flapping % 2 === 0 ? -4 : 3) : 0;
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);

    // 使用自定义贴图时渲染用户图片
    if (customSkin) {
      const size = BIRD_R * 2 + 10;
      const sw = size, sh = size * (customSkin.height / customSkin.width || 1);
      // 翅膀扑动时轻微上下偏移
      ctx.drawImage(customSkin, -sw / 2, -sh / 2 + wob / 2, sw, sh);
      ctx.restore();
      return;
    }

    // 默认卡通小鸟
    // 身体
    ctx.fillStyle = "#f9e105";
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_R + 2, BIRD_R, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#b8860b";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 翅膀
    ctx.fillStyle = "#f3cf06";
    ctx.beginPath();
    ctx.moveTo(-4, -2);
    ctx.quadraticCurveTo(-18, 2 + wob, -14, 12 + wob);
    ctx.quadraticCurveTo(-6, 10, -2, 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 眼睛
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(7, -6, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#222";
    ctx.beginPath();
    ctx.arc(9, -6, 2.6, 0, Math.PI * 2);
    ctx.fill();

    // 喙
    ctx.fillStyle = "#ff8c00";
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.lineTo(25, 2);
    ctx.lineTo(11, 6);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawUI() {
    // 分数（游戏中）
    if (state === "play" || state === "over") {
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.font = "bold 42px sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,0.35)";
      ctx.shadowOffsetY = 3;
      ctx.fillText(String(score), BASE_W / 2, 64);
      ctx.shadowOffsetY = 0;
    }

    if (state === "ready") {
      // 开始提示
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.font = "bold 30px sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,0.3)";
      ctx.shadowOffsetY = 2;
      ctx.fillText("🐤 点击开始", BASE_W / 2, BASE_H / 2 - 130);
      ctx.shadowOffsetY = 0;
      ctx.font = "16px sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.fillText("空格 / 鼠标 / 触摸 操控跳跃", BASE_W / 2, BASE_H / 2 - 100);
      // 准备箭头
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(BIRD_X + 30, bird.y - 30);
      ctx.lineTo(BIRD_X + 30, bird.y - 10);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(BIRD_X + 24, bird.y - 16);
      ctx.lineTo(BIRD_X + 30, bird.y - 6);
      ctx.lineTo(BIRD_X + 36, bird.y - 16);
      ctx.stroke();
      // 最佳分
      if (best > 0) {
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.font = "16px sans-serif";
        ctx.fillText("最高分：" + best, BASE_W / 2, BASE_H / 2 - 60);
      }
    }

    if (state === "over") {
      // 结束面板
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      const cardW = 300, cardH = 250;
      const cx = (BASE_W - cardW) / 2, cy = (BASE_H - cardH) / 2 - 20;
      ctx.fillStyle = "#fdf6e3";
      ctx.beginPath();
      ctx.roundRect(cx, cy, cardW, cardH, 16);
      ctx.fill();
      ctx.strokeStyle = "#d4c891";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#8a6d00";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("游戏结束", BASE_W / 2, cy + 44);
      ctx.fillStyle = "#333";
      ctx.font = "16px sans-serif";
      ctx.fillText("得分：" + score + "   |   最高分：" + best, BASE_W / 2, cy + 82);

      // 重开按钮（绘制为一个圆角矩形）
      const bw = 220, bh = 54, bx = (BASE_W - bw) / 2, by = cy + cardH - 64;
      ctx.fillStyle = "#4caf3f";
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 10);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText("🔄 再来一局", BASE_W / 2, by + 36);
      btnRect = { x: bx, y: by, w: bw, h: bh };
    } else {
      btnRect = null;
    }
  }

  // 重开按钮点击检测
  let btnRect = null;
  canvas.addEventListener("click", function (e) {
    if (state !== "over" || !btnRect) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = BASE_W / rect.width;
    const scaleY = BASE_H / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    if (mx >= btnRect.x && mx <= btnRect.x + btnRect.w &&
        my >= btnRect.y && my <= btnRect.y + btnRect.h) {
      restart();
    }
  });

  // ---------- 主循环 ----------
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // 启动
  best = loadBest();
  reset();
  state = "ready";
  loadSkin();   // 恢复上次导入的自定义贴图
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
