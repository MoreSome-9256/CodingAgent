<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🕊️ Flappy Bird · 自定义小鸟</title>
<style>
  :root {
    --accent: #5ec7f0;
    --accent-2: #f5b942;
    --panel: rgba(255, 255, 255, 0.9);
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #1a8fd0, #0e5f9e 60%, #0a3d6e);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 20px;
    color: #fff;
  }

  .game-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-width: 420px;
    width: 100%;
  }

  .app-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 3px 0 rgba(0, 40, 80, 0.5), 0 0 18px rgba(255, 255, 255, 0.4);
  }
  .app-title .sub {
    display: block;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 4px;
    color: #cdeefb;
    margin-top: 2px;
  }

  .stage {
    position: relative;
    width: 360px;
    height: 560px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow), 0 0 0 3px rgba(255,255,255,0.15);
    background: #b7e5ff;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  /* 控制栏 */
  .control-bar {
    display: flex;
    gap: 12px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    color: #123a55;
    background: linear-gradient(180deg, #ffe79a, #f5b942);
    padding: 10px 18px;
    border-radius: 12px;
    box-shadow: 0 4px 0 #c98a24, 0 6px 14px rgba(0,0,0,0.2);
    transition: transform .06s ease, box-shadow .1s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c98a24; }

  .btn.ghost {
    background: rgba(255,255,255,0.2);
    color: #fff;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.4);
  }

  /* 贴图上传 */
  .upload {
    position: relative;
    overflow: hidden;
  }
  .upload input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .toast {
    min-height: 20px;
    font-size: 13px;
    color: #d9f4ff;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
  <div class="game-wrap">
    <h1 class="app-title">FLAPPY BIRD <span class="sub">自定义小鸟 · 贴图导入版</span></h1>

    <div class="stage">
      <canvas id="gameCanvas" width="360" height="560"></canvas>
    </div>

    <div class="control-bar">
      <button class="btn" id="restartBtn">🔄 重新开始</button>
      <label class="btn upload" title="支持 jpg / png 格式">
        🐦 导入小鸟贴图
        <input type="file" id="birdFile" accept=".jpg,.jpeg,.png,image/jpeg,image/png" />
      </label>
      <button class="btn ghost" id="resetBirdBtn">还原默认</button>
    </div>

    <p class="toast" id="toast">点击画面或按 空格 / ↑ 键让小鸟向上飞</p>
  </div>

<script>
"use strict";

// ==================== 基础工具 ====================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const toast = document.getElementById("toast");

// ---------- 音效（Web Audio 简易合成，失败静默） ----------
let audioCtx = null;
function beep(freq, dur, type = "square", vol = 0.03) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) { /* 忽略音频错误 */ }
}
function sFlap() { beep(600, 0.08, "square", 0.04); }
function sScore(){ beep(1300, 0.09, "sine",  0.05); }
function sHit()  { beep(180, 0.25, "sawtooth", 0.05); }

// ==================== 游戏常量 ====================
const GROUND_H = 90;            // 地面高度
const BIRD_X = 70;              // 小鸟固定水平位置
const GRAVITY = 0.55;           // 重力
const FLAP_FORCE = -8.2;        // 上浮力
const PIPE_W = 62;              // 管道宽度
const PIPE_GAP = 150;           // 上下管道之间间隙
const PIPE_SPEED = 2.6;         // 管道左移速度
const PIPE_SPACING = 190;       // 相邻管道水平间隔

// ==================== 游戏状态 ====================
const ST = { READY: "READY", PLAY: "PLAY", OVER: "OVER" };
let state = ST.READY;

// ==================== 小鸟 ====================
let bird = {
  x: BIRD_X,
  y: H / 2,
  r: 15,          // 物理碰撞半径
  vy: 0,
  rot: 0,
  frame: 0,       // 翅膀扇动帧
};

// ---------- 自定义贴图 ----------
let birdImage = null;           // 用户贴图
let birdImageSrc = "";          // 数据URI，用于标记
function defaultImage() {
  birdImage = null;
  birdImageSrc = "";
  toast.textContent = "已切换为默认小鸟 🕊️";
}
function loadImageFromFile(file) {
  const ok = file && (file.type === "image/png" || file.type === "image/jpeg" || file.type === "image/jpg");
  if (!ok) {
    toast.textContent = "格式不支持，请选择 jpg 或 png 图片";
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      birdImage = img;
      toast.textContent = `✅ 贴图导入成功（${file.name}）`;
      beep(1200, 0.1, "sine", 0.05);
    };
    img.onerror = () => { toast.textContent = "❌ 贴图加载失败，请换一张试试"; };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ==================== 管道 ====================
let pipes = [];
function makePipe(x) {
  const topH = 60 + Math.random() * (H - GROUND_H - PIPE_GAP - 120);
  return {
    x,
    w: PIPE_W,
    topH,                     // 上管道底部高度
    scored: false,
  };
}
function resetPipes() {
  pipes = [];
  for (let i = 0; i < 3; i++) pipes.push(makePipe(W + 120 + i * PIPE_SPACING));
}

// ==================== 场景装饰 ====================
const clouds = [];
for (let i = 0; i < 5; i++) {
  clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 150, s: 0.6 + Math.random() * 0.7, sp: 0.2 + Math.random() * 0.25 });
}
// 地面纹理偏移
let groundOff = 0;

// ==================== 计分 ====================
let score = 0;

// ==================== 重置 ====================
function resetGame(scoredReset) {
  bird.y = H / 2;
  bird.vy = 0;
  bird.rot = 0;
  score = 0;
  resetPipes();
  state = ST.READY;
  if (!scoredReset) toast.textContent = "点击画面或按 空格 / ↑ 键开始";
}

// ==================== 输入 ====================
function flap() {
  if (state === ST.OVER) return;
  if (state === ST.READY) state = ST.PLAY;
  bird.vy = FLAP_FORCE;
  sFlap();
}
function tap(e) {
  // 点击画布触发
  if (e.type === "keydown" && e.code !== "Space" && e.code !== "ArrowUp") return;
  e.preventDefault && e.preventDefault();
  flap();
}

canvas.addEventListener("pointerdown", tap);
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    flap();
  }
});

// ==================== 更新 ====================
function update() {
  // 装饰：云朵移动
  for (const c of clouds) { c.x -= c.sp; if (c.x < -80) { c.x = W + 20; } }
  groundOff = (groundOff + PIPE_SPEED) % 24;

  if (state === ST.PLAY) {
    // 小鸟物理
    bird.vy += GRAVITY;
    bird.y += bird.vy;

    // 旋转角：上升微微仰头，下落低头
    const target = bird.vy < 0 ? -0.35 : Math.min(bird.vy * 0.05, 1.35);
    bird.rot += (target - bird.rot) * 0.12;

    // 翅膀扇动帧
    bird.frame += 1;

    // 管道移动
    for (const p of pipes) p.x -= PIPE_SPEED;

    // 生成新管道
    const last = pipes[pipes.length - 1];
    if (last.x < W - PIPE_SPACING + PIPE_W) {
      pipes.push(makePipe(W + 60 + Math.random() * 40));
    }

    // 回收移出屏幕的管道
    if (pipes[0] && pipes[0].x + pipes[0].w < -10) pipes.shift();

    // 碰撞检测
    if (bird.y > H - GROUND_H - bird.r || bird.y < bird.r) collide();
    for (const p of pipes) {
      // 计分：小鸟通过管道中心
      if (!p.scored && p.x + p.w < bird.x - bird.r) {
        p.scored = true;
        score++;
        sScore();
      }
      // AABB 碰撞
      if (rectHitsBird(p.x, 0, p.w, p.topH) || rectHitsBird(p.x, p.topH + PIPE_GAP, p.w, H - GROUND_H - p.topH - PIPE_GAP)) {
        collide();
        break;
      }
    }
  }
}

function rectHitsBird(rx, ry, rw, rh) {
  // 将小鸟近似为正方形碰撞盒
  const s = bird.r * 1.4;
  return bird.x + bird.r > rx && bird.x - bird.r < rx + rw &&
         bird.y + bird.r > ry && bird.y - bird.r < ry + rh;
}

function collide() {
  state = ST.OVER;
  sHit();
  toast.textContent = "💥 撞到了！点击「重新开始」再来一局";
}

// ==================== 渲染 ====================
function drawSky() {
  // 渐变天空
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#8ad6ff");
  g.addColorStop(0.6, "#c2ecff");
  g.addColorStop(1, "#e8f9ff");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 云朵
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  for (const c of clouds) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 16 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 18 * c.s, c.y - 6 * c.s, 13 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 34 * c.s, c.y, 15 * c.s, 0, Math.PI * 2);
    ctx.fill();
  }

  // 太阳
  ctx.fillStyle = "rgba(255, 224, 130, 0.9)";
  ctx.beginPath();
  ctx.arc(W - 40, 45, 22, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipes() {
  for (const p of pipes) {
    const grad = ctx.createLinearGradient(p.x, 0, p.x + p.w, 0);
    grad.addColorStop(0, "#4e9b3a");
    grad.addColorStop(0.5, "#77c94f");
    grad.addColorStop(1, "#3a7d2e");
    ctx.fillStyle = grad;

    // 上管道
    ctx.fillRect(p.x, 0, p.w, p.topH);
    rim(p.x, p.topH, p.w);
    // 下管道
    const bottomY = p.topH + PIPE_GAP;
    ctx.fillRect(p.x, bottomY, p.w, H - GROUND_H - bottomY);
    rim(p.x, bottomY, p.w);
  }
}

function rim(x, y, w) {
  // 管口
  ctx.fillStyle = "#86d963";
  ctx.fillRect(x - 3, y - 16, w + 6, 21);
  // 顶部高光
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(x + 6, y - 16, 8, 21);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  const s = bird.r / 15;

  if (birdImage) {
    // 使用自定义贴图
    ctx.drawImage(birdImage, -18 * s, -18 * s, 36 * s, 36 * s);
  } else {
    // 默认小鸟
    // 身体
    ctx.fillStyle = "#ffd93b";
    ctx.beginPath();
    ctx.ellipse(0, 0, 17 * s, 13 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 翅膀（扇动）
    ctx.fillStyle = "#f5b942";
    ctx.beginPath();
    const wingAng = Math.sin(bird.frame * 0.35) * 0.6;
    ctx.save();
    ctx.rotate(wingAng);
    ctx.ellipse(-6 * s, 4 * s, 9 * s, 5 * s, 0.4, 0, Math.PI * 2);
    ctx.restore();
    ctx.fill();
    // 肚皮
    ctx.fillStyle = "#fff3cf";
    ctx.beginPath();
    ctx.ellipse(4 * s, 6 * s, 9 * s, 6 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 眼睛
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(8 * s, -5 * s, 5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(9.5 * s, -5 * s, 2.6 * s, 0, Math.PI * 2);
    ctx.fill();
    // 嘴
    ctx.fillStyle = "#ff8a2e";
    ctx.beginPath();
    ctx.moveTo(13 * s, 0);
    ctx.lineTo(22 * s, 3 * s);
    ctx.lineTo(13 * s, 7 * s);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawGround() {
  const y = H - GROUND_H;
  const grad = ctx.createLinearGradient(0, y, 0, H);
  grad.addColorStop(0, "#c8a24a");
  grad.addColorStop(0.4, "#a97a3a");
  grad.addColorStop(1, "#8a5b2a");
  ctx.fillStyle = grad;
  ctx.fillRect(0, y, W, GROUND_H);

  // 草地条
  ctx.fillStyle = "#74c74f";
  ctx.fillRect(0, y, W, 14);
  // 滚动纹理
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  for (let x = -groundOff - 24; x < W + 24; x += 24) {
    ctx.fillRect(x, y + 18, 12, 4);
  }
}

function drawHUD() {
  // 分数
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.font = "900 52px 'Segoe UI', Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(score, W / 2, 60);
  ctx.fillStyle = "#fff";
  ctx.font = "900 50px 'Segoe UI', Arial";
  ctx.fillText(score, W / 2 - 2, 58);

  // 游戏未开始时提示
  if (state === ST.READY) {
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = "700 22px 'Segoe UI', 'Microsoft YaHei', Arial";
    ctx.fillText("点击屏幕开始", W / 2, H / 2 - 70);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "400 14px 'Segoe UI', 'Microsoft YaHei', Arial";
    ctx.fillText("空格 / ↑ 键 或 点击 / 触摸", W / 2, H / 2 - 44);
  }
  if (state === ST.OVER) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    const pad = 24;
    const bw = 220, bh = 90;
    const bx = W / 2 - bw / 2, by = H / 2 - bh / 2 + 20;
    roundRect(bx, by, bw, bh, 16);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "900 26px 'Segoe UI', Arial";
    ctx.fillText("游戏结束", W / 2, by + 34);
    ctx.font = "700 20px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("得分：" + score, W / 2, by + 62);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  drawSky();
  drawPipes();
  drawGround();
  drawBird();
  drawHUD();
}

// ==================== 主循环 ====================
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ==================== 事件绑定 ====================
document.getElementById("restartBtn").addEventListener("click", () => { resetGame(false); });
document.getElementById("birdFile").addEventListener("change", (e) => {
  loadImageFromFile(e.target.files[0]);
  e.target.value = "";
});
document.getElementById("resetBirdBtn").addEventListener("click", () => { defaultImage(); });

// ==================== 启动 ====================
resetGame(false);
loop();
</script>
</body>
</html>
